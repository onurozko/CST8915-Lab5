
services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  order-service:
    image: tonurozkoral/order-service:latest
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_CONNECTION_STRING: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      PORT: "3000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  product-service:
    image: tonurozkoral/product-service:latest
    pull_policy: always
    ports:
      - "3030:3030"
    environment:
      PORT: "3030"

  store-front:
    image: tonurozkoral/store-front:latest
    pull_policy: always
    ports:
      - "8080:80"
    depends_on:
      - product-service
      - order-service

volumes:
  rabbitmq-data:
